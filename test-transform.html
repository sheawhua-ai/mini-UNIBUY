<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #ccc; margin: 0; padding: 0; }
  .mobile-container {
    max-width: 400px; margin: 0 auto; min-height: 100vh;
    background: white; transform: translateZ(0); position: relative;
  }
  .header {
    position: fixed; top: 0; left: 0; width: 100%; height: 50px; background: red;
  }
  .content { padding-top: 60px; height: 2000px; }
</style>
</head>
<body>
  <div class="mobile-container">
    <div class="header">Header</div>
    <div class="content">Content</div>
  </div>
</body>
</html>
